<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI004 TP Portrait Mockup</title>
  <style>
    :root {
      --brand-blue: #001489;
      --brand-green: #2e7d32;
      --brand-yellow: #ffb81c;
      --ink: #102a43;
      --muted: #486581;
      --paper: #fffdf8;
      --line: #e7d9c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, #fff5d6 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, #dff5ff 0%, transparent 40%),
        linear-gradient(135deg, #f5f9ff 0%, #fffaf0 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      padding: 20px;
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      border: 10px solid #0f172a;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 28px 60px rgba(16, 42, 67, 0.26);
      position: relative;
    }

    .status-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 132px;
      height: 28px;
      background: #0f172a;
      border-radius: 14px;
      z-index: 9;
    }

    .appbar {
      margin-top: 22px;
      height: 78px;
      padding: 14px 16px 8px;
      background: linear-gradient(135deg, #ffffff, #fff8ef);
      border-bottom: 3px solid var(--brand-yellow);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 800;
      color: var(--brand-blue);
      letter-spacing: 0.2px;
      font-size: 16px;
    }

    .icons {
      display: flex;
      gap: 8px;
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(145deg, #ffffff, #e8eff6);
      border: 1px solid #d2e0ee;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.12);
    }

    .screen {
      padding: 10px 12px 16px;
      background: #fff;
      height: calc(100% - 100px);
      overflow: hidden;
    }

    .hero {
      border: 1.4px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(140deg, #fffcf7, #fffefb, #fdfbf8);
      box-shadow: 0 10px 18px rgba(16, 42, 67, 0.08);
      padding: 12px 12px 12px;
    }

    .identity {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 22px;
      padding: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffc857, #ff8a3d);
      padding: 4px;
      box-shadow: 0 8px 14px rgba(255,138,61,0.35);
      position: relative;
      flex: 0 0 auto;
    }

    .logo::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      right: -2px;
      bottom: -2px;
      border-radius: 50%;
      background: #102a43;
      border: 2px solid #fff;
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: #fff7ea;
      display: grid;
      place-items: center;
      color: #d97706;
      font-weight: 700;
      font-size: 12px;
    }

    .title {
      padding-top: 8px;
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      margin: 8px auto 0;
      width: 100%;
      max-width: 330px;
      border-radius: 16px;
      background: #102a43;
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
    }

    .bank {
      margin: 8px auto 0;
      max-width: 330px;
      border-radius: 18px;
      border: 1.4px solid rgba(21, 128, 61, 0.55);
      background: linear-gradient(135deg, rgba(21,128,61,0.18), rgba(21,128,61,0.06), rgba(255,255,255,0.9));
      color: #15803d;
      padding: 10px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .scanner {
      margin: 8px auto 0;
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      background: linear-gradient(140deg, #073b4c, #118ab2, #06d6a0);
      display: grid;
      place-items: center;
      color: white;
      text-align: center;
      font-weight: 800;
      line-height: 1.2;
    }

    .scanner small {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
    }

    .card {
      margin-top: 10px;
      border-radius: 14px;
      border: 1px solid #e6edf5;
      padding: 12px;
      background: #fff;
      box-shadow: 0 3px 8px rgba(16,42,67,0.05);
      font-size: 13px;
      font-weight: 700;
      color: #334e68;
    }

    .badge {
      float: right;
      background: #ef4444;
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      padding: 3px 8px;
      font-weight: 800;
    }

    .caption {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-notch"></div>
    <div class="appbar">
      <div class="brand">Local Lekker</div>
      <div class="icons">
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
      </div>
    </div>

    <div class="screen">
      <div class="hero">
        <div class="identity">
          <div class="row">
            <div class="logo"><div class="logo-inner">LOGO</div></div>
            <div style="min-width:0;flex:1">
              <div class="title">Trusted Partner</div>
            </div>
          </div>

          <div class="btn">Edit Profile</div>
          <div class="bank">Banking Details Active</div>
          <div class="scanner">
            QR Scanner
            <small>Tap to open scanner</small>
          </div>
        </div>
      </div>

      <div class="card">Deal Authorizations <span class="badge">5</span></div>
      <div class="card">Analytics Overview</div>
      <div class="card">Discount Summary</div>
    </div>

    <div class="caption">UI004 Android Portrait Proposal • Content shifted higher</div>
  </div>
</body>
</html>
