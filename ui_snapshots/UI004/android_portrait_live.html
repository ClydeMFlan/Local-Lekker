<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Lekker — Android Portrait (live)</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #1f2933;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        }

        .label {
            color: #cbd5e1;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 10px 0 8px;
        }

        .phone {
            width: 412px;
            height: 915px;
            border: 10px solid #0f172a;
            border-radius: 36px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            background: #000;
        }

        .phone iframe {
            width: 412px;
            height: 915px;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>
    <div class="label">Local Lekker — Android portrait preview (412 × 915)</div>
    <div class="phone">
        <iframe src="http://127.0.0.1:8080/" title="Local Lekker live app"></iframe>
    </div>
</body>

</html>
