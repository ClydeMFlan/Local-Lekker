name: local_lekker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Supabase client for Flutter
  supabase_flutter: ^2.10.0
  # HTTP client for PayFast calls or server communication
  http: ^1.1.0
  # Launch external URLs (PayFast redirect flow)
  url_launcher: ^6.1.10
  # Load environment variables (Supa keys)
  flutter_dotenv: ^6.0.0
  crypto: ^3.0.6
  # Charts for dashboard
  fl_chart: ^1.1.0
  # Logging framework
  logger: ^2.5.0
  # Local storage for pending payments
  shared_preferences: ^2.2.0
  # Deep link handling for authentication
  app_links: ^6.4.1
  qr_flutter: ^4.1.0
  # QR code scanning
  mobile_scanner: ^6.0.0
  # Camera for image capture
  camera: ^0.11.0+2
  # Image picker for gallery access
  image_picker: ^1.0.4
  # OCR and ML Kit for text recognition and image labeling
  google_mlkit_image_labeling: ^0.14.0
  google_mlkit_text_recognition: ^0.15.0

  qr: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
